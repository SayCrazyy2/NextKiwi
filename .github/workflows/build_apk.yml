# Build NextKiwi APK (self-hosted runner)
name: 'NextKiwi: Build APK'

on:
  pull_request:
    branches:
      - nextkiwi
  workflow_dispatch:

concurrency: build_apk

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout NextKiwi patches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read build configuration
        id: config
        run: |
          source CHROMIUM_VERSION
          echo "chromium_version=${CHROMIUM_MAJOR}.${CHROMIUM_MINOR}.${CHROMIUM_BUILD}.${CHROMIUM_PATCH}" >> $GITHUB_OUTPUT
          source NEXTKIWI_VERSION
          echo "nextkiwi_version=${MAJOR}.${MINOR}.${BUILD}.${PATCH}" >> $GITHUB_OUTPUT

      - name: Setup build environment
        run: |
          export PATH="$PATH:/root/nkiwi/depot_tools"
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "Using $(nproc) cores, $(free -h | grep Mem | awk '{print $2}') RAM"

      - name: Ensure Chromium source exists
        run: |
          if [ ! -d /root/nkiwi/chromium/src/.git ]; then
            echo "::warning::Chromium source not found. Run the fetch step manually first."
            echo "See BUILDING.md for instructions on fetching Chromium source."
            exit 1
          fi
          echo "Chromium source found at /root/nkiwi/chromium/src"

      - name: Apply NextKiwi patches
        run: |
          cd /root/nkiwi/chromium/src
          # Stash any existing changes
          git stash || true
          # Reset to clean Chromium state
          git checkout .
          # Apply NextKiwi patch overlay
          rsync -avz --exclude='.git' --exclude='.github' --exclude='.build' \
            --exclude='BUILDING.md' --exclude='NEXTKIWI_VERSION' \
            $GITHUB_WORKSPACE/ ./
          echo "Patches applied"

      - name: Configure build (arm64)
        run: |
          cd /root/nkiwi/chromium/src
          mkdir -p out/android_arm64
          cat .build/production_build_reference/args.gn | \
            sed "s#android_default_version_name = \"Git\"#android_default_version_name = \"${{ steps.config.outputs.nextkiwi_version }}\"#" > \
            out/android_arm64/args.gn
          sed -i "s#android_default_version_code = \"1\"#android_default_version_code = \"$(date '+%y%m%d')2\"#" \
            out/android_arm64/args.gn
          cat out/android_arm64/args.gn

      - name: Generate build files
        run: |
          cd /root/nkiwi/chromium/src
          gn gen out/android_arm64

      - name: Build APK
        run: |
          cd /root/nkiwi/chromium/src
          ninja -C out/android_arm64 chrome_public_apk

      - name: Prepare APK for upload
        run: |
          cd /root/nkiwi/chromium/src/out/android_arm64/apks
          cp ChromePublic.apk $GITHUB_WORKSPACE/NextKiwi-arm64-${{ github.run_id }}.apk || \
            find /root/nkiwi/chromium/src/out/android_arm64 -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/NextKiwi-arm64-${{ github.run_id }}.apk \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextkiwi-apk-arm64
          path: NextKiwi-arm64-${{ github.run_id }}.apk
          retention-days: 30