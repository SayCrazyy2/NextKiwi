# Build and sign NextKiwi release APKs
name: 'NextKiwi: Build and sign release'

on:
  workflow_dispatch:
    inputs:
      createRelease:
        description: 'Create a GitHub release with the APKs'
        required: true
        default: 'yes'

jobs:
  build:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [arm64, arm, x64]

    steps:
      - name: Checkout NextKiwi patches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read build configuration
        id: config
        run: |
          source CHROMIUM_VERSION
          echo "chromium_version=${CHROMIUM_MAJOR}.${CHROMIUM_MINOR}.${CHROMIUM_BUILD}.${CHROMIUM_PATCH}" >> $GITHUB_OUTPUT
          source NEXTKIWI_VERSION
          echo "nextkiwi_version=${MAJOR}.${MINOR}.${BUILD}.${PATCH}" >> $GITHUB_OUTPUT

      - name: Apply NextKiwi patches
        run: |
          cd /root/nkiwi/chromium/src
          git stash || true
          git checkout .
          rsync -avz --exclude='.git' --exclude='.github' --exclude='.build' \
            --exclude='BUILDING.md' --exclude='NEXTKIWI_VERSION' \
            $GITHUB_WORKSPACE/ ./

      - name: Configure and build (${{ matrix.platform }})
        run: |
          cd /root/nkiwi/chromium/src
          mkdir -p out/android_${{ matrix.platform }}
          
          ARCH_SUFFIX=""
          VERSION_CODE_SUFFIX=""
          case "${{ matrix.platform }}" in
            arm)   ARCH_SUFFIX="arm";   VERSION_CODE_SUFFIX="1" ;;
            arm64) ARCH_SUFFIX="arm64"; VERSION_CODE_SUFFIX="2" ;;
            x86)   ARCH_SUFFIX="x86";   VERSION_CODE_SUFFIX="3" ;;
            x64)   ARCH_SUFFIX="x64";   VERSION_CODE_SUFFIX="4" ;;
          esac
          
          cat .build/production_build_reference/args.gn | \
            sed "s#target_cpu = \"arm64\"#target_cpu = \"${{ matrix.platform }}\"#" | \
            sed "s#android_default_version_name = \"Git\"#android_default_version_name = \"${{ steps.config.outputs.nextkiwi_version }}\"#" | \
            sed "s#android_default_version_code = \"1\"#android_default_version_code = \"$(date '+%y%m%d')${VERSION_CODE_SUFFIX}\"#" > \
            out/android_${{ matrix.platform }}/args.gn
          
          cat out/android_${{ matrix.platform }}/args.gn
          gn gen out/android_${{ matrix.platform }}
          ninja -C out/android_${{ matrix.platform }} chrome_public_apk

      - name: Copy APK
        run: |
          cd /root/nkiwi/chromium/src/out/android_${{ matrix.platform }}/apks
          cp ChromePublic.apk $GITHUB_WORKSPACE/NextKiwi-${{ matrix.platform }}-${{ github.run_id }}.apk || \
            find /root/nkiwi/chromium/src/out/android_${{ matrix.platform }} -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/NextKiwi-${{ matrix.platform }}-${{ github.run_id }}.apk \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.platform }}
          path: NextKiwi-${{ matrix.platform }}-${{ github.run_id }}.apk
          retention-days: 90

  release:
    runs-on: self-hosted
    needs: build
    if: contains(github.event.inputs.createRelease, 'yes')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Prepare release notes
        run: |
          cat > release_notes.md << EOT
          # NextKiwi ${{ needs.build.outputs.nextkiwi_version }}

          Based on Chromium ${{ needs.build.outputs.chromium_version }}.

          ## Downloads
          - **arm64** — modern devices, best performance
          - **arm** — older devices, lower memory
          - **x64** — emulators, Intel tablets

          This release was built from commit ${{ github.sha }} (run ${{ github.run_id }}).
          EOT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_id }}
          name: NextKiwi Build ${{ github.run_id }}
          body_path: release_notes.md
          prerelease: true
          files: apks/**/*.apk