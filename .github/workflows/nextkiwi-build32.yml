name: 'NextKiwi: Staged Build (32-bit ARM)'

on:
  workflow_dispatch:
    inputs:
      skip_validation:
        description: 'Skip the overlay validation step'
        required: false
        default: 'no'

permissions:
  contents: write

env:
  CHROMIUM_VERSION: '140.0.7339.264'
  CCACHE_DIR: /tmp/ccache
  CCACHE_MAXSIZE: '5G'
  CCACHE_SLOPPINESS: 'include_file_mtime,include_file_ctime,system_headers,time_macros'
  CCACHE_COMPILERCHECK: 'content'
  CCACHE_BASEDIR: /tmp/chromium/src
  DEPOT_TOOLS: /tmp/depot_tools

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.skip_validation != 'yes'
    outputs:
      valid_files: ${{ steps.validate.outputs.valid_files }}
      bad_files: ${{ steps.validate.outputs.bad_files }}
    steps:
      - name: Checkout NextKiwi patches
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache
          sudo apt-get clean
          docker system prune -af --volumes 2>/dev/null || true
          sudo rm -rf /var/lib/docker

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            openjdk-17-jdk-headless ninja-build ccache pkg-config git-lfs \
            curl ca-certificates python3 gperf libncurses-dev

      - name: Setup depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $DEPOT_TOOLS
          echo -n "python3/bin" > $DEPOT_TOOLS/python3_bin_reldir.txt
          mkdir -p $DEPOT_TOOLS/python3/bin
          ln -sf /usr/bin/python3 $DEPOT_TOOLS/python3/bin/python3
          echo "$DEPOT_TOOLS" >> $GITHUB_PATH

      - name: Fetch Chromium source
        run: |
          mkdir -p /tmp/chromium && cd /tmp/chromium
          cat > .gclient << 'EOF'
          solutions = [
            { "name" : 'src', "url" : 'https://chromium.googlesource.com/chromium/src.git',
              "deps_file" : 'DEPS', "managed" : False,
              "custom_deps" : {}, "custom_vars": {} },
          ]
          target_os = ["android"]
          EOF
          gclient sync --revision $CHROMIUM_VERSION --no-history --nohooks
          gclient runhooks
          rm -rf /tmp/chromium/src/.git

      - name: Init git + apply patches
        run: |
          cd /tmp/chromium/src
          git init && git add -A
          git config user.email "bot@nextkiwi" && git config user.name "NextKiwi"
          git commit -m "baseline" --no-verify
          git apply $GITHUB_WORKSPACE/patches/chromium140_buildfixes.patch || true
          git apply $GITHUB_WORKSPACE/patches/http_network_transaction_cors_fix.patch || true
          while IFS= read -r file; do
            src="$GITHUB_WORKSPACE/$file"
            dst="/tmp/chromium/src/$file"
            if [ -f "$src" ]; then
              mkdir -p "$(dirname "$dst")" && cp "$src" "$dst"
            fi
          done < $GITHUB_WORKSPACE/patches/kiwi_overlay_files.txt

      - name: Configure build (32-bit ARM)
        run: |
          mkdir -p /tmp/chromium/src/out/android_arm
          cat > /tmp/chromium/src/out/android_arm/args.gn << 'EOF'
          target_os = "android"
          target_cpu = "arm"
          is_debug = false
          is_java_debug = false
          android_channel = "dev"
          is_official_build = false
          is_component_build = false
          is_chrome_branded = false
          is_clang = true
          symbol_level = 0
          blink_symbol_level = 0
          use_thin_lto = false
          use_lld = true
          exclude_unwind_tables = true
          use_unofficial_version_number = false
          android_default_version_code = "2608212"
          android_keystore_name = "dev"
          android_keystore_password = "public_password"
          android_keystore_path = "//keystore.jks"
          android_default_version_name = "140.0.7339.264"
          fieldtrial_testing_like_official_build = true
          icu_use_data_file = false
          google_api_key = "NEXTKIWI"
          google_default_client_id = "42.apps.nextkiwi.com"
          google_default_client_secret = "NEXTKIWI_NOT_SO_SECRET"
          use_official_google_api_keys = false
          ffmpeg_branding = "Chrome"
          proprietary_codecs = true
          enable_widevine = true
          enable_mse_mpeg2ts_stream_parser = true
          enable_remoting = false
          rtc_use_h264 = false
          v8_use_external_startup_data = true
          update_android_aar_prebuilts = true
          enable_extensions = false
          enable_desktop_android_extensions = true
          enable_guest_view = true
          is_desktop_android = true
          enable_pdf = false
          enable_plugins = false
          disable_android_lint = true
          treat_warnings_as_errors = false
          cc_wrapper = "ccache"
          use_siso = false
          EOF
          cd /tmp/chromium/src && gn gen out/android_arm 2>&1 | tail -5

      - name: Validate overlay files compile
        id: validate
        run: |
          echo "=== Testing each overlay .cc file compiles ==="
          VALID_FILES=""
          BAD_FILES=""
          for f in $(cat $GITHUB_WORKSPACE/patches/kiwi_overlay_files.txt | grep '\.cc$'); do
            echo "--- Testing: $f ---"
            if ninja -C /tmp/chromium/src/out/android_arm -j4 $(echo "$f" | sed 's|\.cc$|.o|' | sed 's|/|_|g') 2>/tmp/val_err.txt; then
              echo "OK: $f"
              VALID_FILES="$VALID_FILES $f"
            else
              echo "FAIL: $f"
              head -5 /tmp/val_err.txt
              BAD_FILES="$BAD_FILES $f"
            fi
          done
          echo "valid_files=$VALID_FILES" >> $GITHUB_OUTPUT
          echo "bad_files=$BAD_FILES" >> $GITHUB_OUTPUT
          if [ -n "$BAD_FILES" ]; then
            for f in $BAD_FILES; do
              grep -v "^${f}$" $GITHUB_WORKSPACE/patches/kiwi_overlay_files.txt > /tmp/overlay_clean.txt
              mv /tmp/overlay_clean.txt $GITHUB_WORKSPACE/patches/kiwi_overlay_files.txt
            done
          fi

      - name: Upload cleaned overlay
        if: steps.validate.outputs.bad_files != ''
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-overlay
          path: patches/kiwi_overlay_files.txt
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    needs: validate
    if: always() && !cancelled()
    steps:
      - name: Checkout NextKiwi patches
        uses: actions/checkout@v4

      - name: Download cleaned overlay
        uses: actions/download-artifact@v4
        with:
          name: cleaned-overlay
          path: patches/
        continue-on-error: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache
          sudo apt-get clean
          docker system prune -af --volumes 2>/dev/null || true
          sudo rm -rf /var/lib/docker

      - name: Install build deps + gh CLI
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            openjdk-17-jdk-headless ninja-build ccache pkg-config git-lfs \
            curl ca-certificates python3 gperf libncurses-dev gh

      - name: Setup depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $DEPOT_TOOLS
          echo -n "python3/bin" > $DEPOT_TOOLS/python3_bin_reldir.txt
          mkdir -p $DEPOT_TOOLS/python3/bin
          ln -sf /usr/bin/python3 $DEPOT_TOOLS/python3/bin/python3
          echo "$DEPOT_TOOLS" >> $GITHUB_PATH

      - name: Fetch Chromium source
        run: |
          mkdir -p /tmp/chromium && cd /tmp/chromium
          cat > .gclient << 'EOF'
          solutions = [
            { "name" : 'src', "url" : 'https://chromium.googlesource.com/chromium/src.git',
              "deps_file" : 'DEPS', "managed" : False,
              "custom_deps" : {}, "custom_vars": {} },
          ]
          target_os = ["android"]
          EOF
          gclient sync --revision $CHROMIUM_VERSION --no-history --nohooks
          gclient runhooks
          rm -rf /tmp/chromium/src/.git

      - name: Init git + apply patches
        run: |
          cd /tmp/chromium/src
          git init && git add -A
          git config user.email "bot@nextkiwi" && git config user.name "NextKiwi"
          git commit -m "baseline" --no-verify
          git apply $GITHUB_WORKSPACE/patches/chromium140_buildfixes.patch || true
          git apply $GITHUB_WORKSPACE/patches/http_network_transaction_cors_fix.patch || true
          while IFS= read -r file; do
            src="$GITHUB_WORKSPACE/$file"
            dst="/tmp/chromium/src/$file"
            if [ -f "$src" ]; then
              mkdir -p "$(dirname "$dst")" && cp "$src" "$dst"
            fi
          done < $GITHUB_WORKSPACE/patches/kiwi_overlay_files.txt
          for f in $(find /tmp/chromium/src/net/http/http_network_transaction.cc \
                           /tmp/chromium/src/components/search/search_url_fetcher.cc \
                           /tmp/chromium/src/components/search/search_url_fetcher.h 2>/dev/null); do
            if [ -f "$f" ]; then
              sed -i 's#include "base/bind.h"#include "base/functional/bind.h"#' "$f" 2>/dev/null || true
              sed -i 's#include "base/callback.h"#include "base/functional/callback.h"#' "$f" 2>/dev/null || true
              sed -i 's#include "base/callback_helpers.h"#include "base/functional/callback_helpers.h"#' "$f" 2>/dev/null || true
            fi
          done

      - name: Configure build (32-bit ARM)
        run: |
          mkdir -p /tmp/chromium/src/out/android_arm
          cat > /tmp/chromium/src/out/android_arm/args.gn << 'EOF'
          target_os = "android"
          target_cpu = "arm"
          is_debug = false
          is_java_debug = false
          android_channel = "dev"
          is_official_build = false
          is_component_build = false
          is_chrome_branded = false
          is_clang = true
          symbol_level = 0
          blink_symbol_level = 0
          use_thin_lto = false
          use_lld = true
          exclude_unwind_tables = true
          use_unofficial_version_number = false
          android_default_version_code = "2608212"
          android_keystore_name = "dev"
          android_keystore_password = "public_password"
          android_keystore_path = "//keystore.jks"
          android_default_version_name = "140.0.7339.264"
          fieldtrial_testing_like_official_build = true
          icu_use_data_file = false
          google_api_key = "NEXTKIWI"
          google_default_client_id = "42.apps.nextkiwi.com"
          google_default_client_secret = "NEXTKIWI_NOT_SO_SECRET"
          use_official_google_api_keys = false
          ffmpeg_branding = "Chrome"
          proprietary_codecs = true
          enable_widevine = true
          enable_mse_mpeg2ts_stream_parser = true
          enable_remoting = false
          rtc_use_h264 = false
          v8_use_external_startup_data = true
          update_android_aar_prebuilts = true
          enable_extensions = false
          enable_desktop_android_extensions = true
          enable_guest_view = true
          is_desktop_android = true
          enable_pdf = false
          enable_plugins = false
          disable_android_lint = true
          treat_warnings_as_errors = false
          cc_wrapper = "ccache"
          use_siso = false
          EOF
          cd /tmp/chromium/src && gn gen out/android_arm
          keytool -genkey -v -keystore /tmp/chromium/src/keystore.jks -alias dev \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass public_password -keypass public_password \
            -dname "cn=NextKiwi, ou=Build, o=NextKiwi, c=GitHub"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-nextkiwi-arm32-${{ github.run_id }}
          restore-keys: |
            ccache-nextkiwi-arm32-

      - name: Restore build state from Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Checking for previous build state in Releases ==="
          mkdir -p /tmp/state_restore
          gh release download "build-state-cache" -p "state_arm32.tar.part*" -D /tmp/state_restore || echo "No previous state chunks found"
          
          if ls /tmp/state_restore/state_arm32.tar.part* 1> /dev/null 2>&1; then
            echo "=== Reconstructing and extracting build objects ==="
            cd /tmp/chromium/src
            cat /tmp/state_restore/state_arm32.tar.part* | tar -xf -
            rm -rf /tmp/state_restore
            echo "=== State restored ==="
            du -sh /tmp/chromium/src/out/android_arm || true
          fi

      - name: Compile APK
        run: |
          ccache --max-size 5G
          ccache --set-config=sloppiness=include_file_mtime,include_file_ctime,system_headers,time_macros
          ccache --set-config=compiler_check=content
          ccache --set-config=base_dir=/tmp/chromium/src
          cd /tmp/chromium/src
          echo "=== Starting build at $(date) ==="
          ccache -s
          set +e
          # 16200s = 4.5 hours safe timeout
          timeout 16200 autoninja -C out/android_arm -j4 chrome_public_apk > /tmp/ninja_output.log 2>&1
          EXIT_CODE=$?
          set -e
          tail -100 /tmp/ninja_output.log
          echo "=== ninja exit code: $EXIT_CODE ==="
          ccache -s

          APK=$(find /tmp/chromium/src/out/android_arm -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "BUILD_COMPLETE=true" >> $GITHUB_ENV
            echo "=== BUILD COMPLETE! APK: $APK ==="
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "=== Build returned 0 but no APK found ==="
            grep -i "FAILED\|error:" /tmp/ninja_output.log | tail -20 || true
            exit 1
          elif [ $EXIT_CODE -eq 124 ]; then
            echo "=== Build timed out gracefully. State will be chunked and saved ==="
          else
            echo "=== Build failed ==="
            grep -i "FAILED\|error:" /tmp/ninja_output.log | tail -20 || true
            exit $EXIT_CODE
          fi

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-nextkiwi-arm32-${{ github.run_id }}

      - name: Save build state chunks to Releases
        if: always() && env.BUILD_COMPLETE != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Preparing build state chunks ==="
          # Ensure pre-release exists
          gh release view "build-state-cache" >/dev/null 2>&1 || \
            gh release create "build-state-cache" --title "Internal Build State Cache" --notes "Automated persistent state chunks" --prerelease

          # Clean up old release assets
          for asset in $(gh release view "build-state-cache" --json assets --jq '.assets[].name' | grep '^state_arm32.tar.part'); do
            gh release delete-asset "build-state-cache" "$asset" -y || true
          done

          echo "=== Compressing output directory into 2GB chunks ==="
          cd /tmp/chromium/src
          tar --exclude='*.apk' -cf - out/android_arm | split -b 2000m - /tmp/state_arm32.tar.part

          echo "=== Uploading state chunks to GitHub Releases ==="
          gh release upload "build-state-cache" /tmp/state_arm32.tar.part* --clobber
          echo "=== Build state successfully persisted ==="

      - name: Upload APK Artifact
        if: env.BUILD_COMPLETE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NextKiwi-arm32-apk
          path: /tmp/chromium/src/out/android_arm/**/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: env.BUILD_COMPLETE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find /tmp/chromium/src/out/android_arm -name "*.apk" -type f | head -1)
          cp "$APK" NextKiwi-arm32.apk
          gh release create nextkiwi-140.0.7339.264-arm32 \
            --title "NextKiwi 140.0.7339.264 (32-bit ARM)" \
            --notes "NextKiwi Browser 32-bit ARM build based on Chromium 140." \
            NextKiwi-arm32.apk || echo "Release creation failed, APK available in artifacts"

      - name: Clean up temporary state release on success
        if: env.BUILD_COMPLETE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "build-state-cache" --cleanup-tag -y || true
