name: 'NextKiwi: Rebase nextkiwi branch'

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Setting-up GitHub username
        run: |
          git config --global user.email "github@actions"
          git config --global user.name "NextKiwi bot"

      - name: Fetching latest
        run: git fetch origin

      - name: Rebasing
        run: git rebase origin/nextkiwi --committer-date-is-author-date

      - name: Pushing
        run: git push origin HEAD:nextkiwi --force